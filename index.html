<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aryan Dhillon — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer working across embedded firmware, distributed systems, applied machine learning, and full-stack product. Computer Engineering at Purdue, May 2027."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230C0A09'/><text y='72' x='50' text-anchor='middle' font-size='64' font-family='sans-serif' font-weight='700' fill='%23A16207'>A</text></svg>" />
    <script>
      // Apply stored theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* localStorage unavailable — fall back to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
